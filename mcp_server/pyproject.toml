[project]
name = "pwc-mcp"
version = "0.2.17"
description = "Read-only Papers With Code MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  # Dependabot floors: certifi 2026.10.18, PyJWT 2.15.0 (via mcp).
  "certifi>=2026.10.18",
  "pyjwt>=2.15.0",
  "mcp>=2.2,<3",
  # GHSA-xcq7-p3pf-p88h: the MCP SDK parses tracestate; older releases are quadratic.
  "opentelemetry-api>=1.45.1",
  "pydantic>=2.11,<3",
  "pwc-cli>=0.4.1,<0.5",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
pwc-mcp = "pwc_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwc_mcp"]

[tool.uv.sources]
pwc-cli = {path = "../standalone_cli", editable = true}

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8"]
