name: Publish pwc CLI

on:
  push:
    tags:
      - "pwc-cli-*"

permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build one-file client
        shell: bash
        run: |
          python standalone_cli/scripts/check_contract.py
          uv venv standalone_cli/.venv
          uv pip install --python standalone_cli/.venv/bin/python pyinstaller ./standalone_cli
          standalone_cli/.venv/bin/pyinstaller \
            --onefile \
            --name "pwc-${GITHUB_REF_NAME#pwc-cli-}-${{ matrix.target }}" \
            --paths standalone_cli/src \
            standalone_cli/entrypoint.py
          artifact="dist/pwc-${GITHUB_REF_NAME#pwc-cli-}-${{ matrix.target }}"
          shasum -a 256 "$artifact" > "$artifact.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pwc-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwc-${{ matrix.target }}
          path: dist/pwc-*

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/pwc-*
          fail_on_unmatched_files: true
