name: Publish pwc CLI

on:
  push:
    tags:
      - "pwc-cli-*"


permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Build one-file client
        shell: bash
        run: |
          python standalone_cli/scripts/check_contract.py
          uv venv standalone_cli/.venv
          uv pip install --python standalone_cli/.venv/bin/python pyinstaller ./standalone_cli
          standalone_cli/.venv/bin/pyinstaller \
            --onefile \
            --name "pwc-${GITHUB_REF_NAME#pwc-cli-}-${{ matrix.target }}" \
            --paths standalone_cli/src \
            standalone_cli/entrypoint.py
          artifact="dist/pwc-${GITHUB_REF_NAME#pwc-cli-}-${{ matrix.target }}"
          shasum -a 256 "$artifact" > "$artifact.sha256"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/pwc-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pwc-${{ matrix.target }}
          path: dist/pwc-*

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/pwc-*
          fail_on_unmatched_files: true
